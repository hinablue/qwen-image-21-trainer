[build-system]
requires = ["hatchling>=1.26"]
build-backend = "hatchling.build"

[project]
name = "qwen-image-21-trainer"
version = "0.1.0"
description = "Small-dataset Qwen-Image 2.1 LoRA trainer based on pinned DiffSynth-Studio"
readme = "README.md"
requires-python = ">=3.11,<3.13"
license = "Apache-2.0"
license-files = ["LICENSE", "licenses/*.txt"]
dependencies = [
  "diffsynth==2.1.8",
  "torch==2.12.1",
  "torchvision==0.27.1",
  "transformers==4.57.6",
  "peft==0.19.1",
  "accelerate==1.6.0",
  "Pillow>=10",
  "PyYAML>=6",
  "safetensors>=0.4.5",
  "tqdm>=4.66",
  "wandb==0.30.0",
  "PyYAML>=6.0,<7",
  "adv-optm==2.5.13",
  "pytorch-wavelets==1.3.0",
  "pywavelets>=1.7,<1.10",
]

[project.scripts]
qwen21 = "qwen21_trainer.cli:main"

[tool.uv.sources]
diffsynth = { path = "vendor/DiffSynth-Studio" }

[dependency-groups]
dev = ["pytest>=8", "ruff>=0.9", "build>=1.2"]

[tool.hatch.build.targets.wheel]
packages = ["src/qwen21_trainer"]

[tool.hatch.build.targets.sdist]
include = ["src/", "vendor/", "tests/", "configs/", "scripts/", "docs/", "licenses/", "README.md", "ATTRIBUTION.md", "LICENSE", "pyproject.toml", "uv.lock", "run.sh", "upstream-manifest.json"]

[tool.ruff]
line-length = 100
exclude = ["vendor"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["vendor", "verification", ".venv", "dist", "build"]
